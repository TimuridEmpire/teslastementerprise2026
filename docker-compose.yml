# Enterprise Deployment Blueprint, Phase 0 (packaging).
#
# NOT a full turnkey `docker compose up` yet -- agent API keys are issued
# dynamically by the router (see scripts/bootstrap_router_agents.py) and
# have to exist before the website and worker containers can authenticate,
# which compose alone can't sequence. The install flow is:
#
#   1. Copy .env.example to .env and fill in ADMIN/SHARED secrets (and
#      OLLAMA_BASE_URL -- see below).
#   2. docker compose up -d router
#   3. docker compose run --rm router python scripts/bootstrap_router_agents.py
#      -- copy the printed <NAME>_AGENT_API_KEY values into .env. These are
#      server-side only (never NEXT_PUBLIC_*): the website's own server
#      proxy (app/api/router/[...path]/route.ts) reads them at request
#      time, and each worker-* service below remaps its own key to the
#      generic ENTERPRISE_AGENT_API_KEY that run_single_agent.py expects.
#   4. docker compose up -d --build
#
# Ollama itself is NOT a service here. Model weights are multi-GB and this
# project doesn't yet have the provider abstraction described in the
# Enterprise Deployment Blueprint's Phase 2 -- for now, point every agent
# at whatever Ollama-compatible endpoint the operator already runs via
# OLLAMA_BASE_URL in .env (a sibling container, the host machine via
# host.docker.internal, or a shared server).

services:
  router:
    build: .
    command: python -m enterprise_router.api
    environment:
      ENTERPRISE_ROUTER_HOST: 0.0.0.0
      ENTERPRISE_ROUTER_PORT: "8000"
      ENTERPRISE_ROUTER_DB: /data/enterprise_router.db
      ENTERPRISE_ROUTER_ADMIN_SECRET: ${ENTERPRISE_ROUTER_ADMIN_SECRET}
      ENTERPRISE_ROUTER_SHARED_SECRET: ${ENTERPRISE_ROUTER_SHARED_SECRET}
      # Off by default -- see build_runner.py. Setting this to 1 here also
      # requires the docker.sock mount below to actually be usable.
      ENTERPRISE_ROUTER_ENABLE_BUILD_HOSTING: ${ENTERPRISE_ROUTER_ENABLE_BUILD_HOSTING:-}
    volumes:
      - router-data:/data
      # Lets build_runner.py's `docker` CLI calls (see its module docstring)
      # reach the *host's* Docker daemon to sandbox a build's generated
      # code -- required only if ENTERPRISE_ROUTER_ENABLE_BUILD_HOSTING=1.
      #
      # Stated plainly, not glossed over: mounting the host's Docker socket
      # into a container is a well-known trade -- anything that can reach
      # that socket can ask the host daemon to run an arbitrary container
      # with arbitrary mounts, which is effectively root on the host. This
      # narrows the blast radius of one problem (unreviewed generated code
      # running with the router's permissions) by introducing a different,
      # bigger one (the router process's own permissions now reach the
      # host, not just its own container) if the router itself is ever
      # compromised. Leave ENTERPRISE_ROUTER_ENABLE_BUILD_HOSTING unset
      # (and drop this mount) unless the Run feature is actually wanted;
      # a rootless Docker daemon or a dedicated sandboxing host reachable
      # over TCP (DOCKER_HOST) instead of this socket are both stronger
      # options a real deployment should evaluate before enabling this.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  website:
    build:
      context: ./website
      # No build args here anymore. Credentials used to be passed as
      # NEXT_PUBLIC_* build args because Next.js inlines those into the
      # client JS bundle -- which is exactly how the admin secret and
      # every agent's API key ended up shipping to the browser in
      # plaintext. They're server-side runtime env vars now (below),
      # read only by app/api/router/[...path]/route.ts, so rotating one
      # no longer requires an image rebuild either.
    environment:
      ROUTER_URL: http://router:8000
      ENTERPRISE_ROUTER_ADMIN_SECRET: ${ENTERPRISE_ROUTER_ADMIN_SECRET}
      MANAGER_AGENT_API_KEY: ${MANAGER_AGENT_API_KEY}
      CEO_AGENT_API_KEY: ${CEO_AGENT_API_KEY}
      PM_AGENT_API_KEY: ${PM_AGENT_API_KEY}
      ENGINEERING_AGENT_API_KEY: ${ENGINEERING_AGENT_API_KEY}
      HR_AGENT_API_KEY: ${HR_AGENT_API_KEY}
      SALES_AGENT_API_KEY: ${SALES_AGENT_API_KEY}
      MARKETING_AGENT_API_KEY: ${MARKETING_AGENT_API_KEY}
      FINANCE_AGENT_API_KEY: ${FINANCE_AGENT_API_KEY}
    ports:
      - "3000:3000"
    depends_on:
      router:
        condition: service_healthy
    restart: unless-stopped

  worker-ceo:
    build: .
    command: python run_single_agent.py CEO --poll-interval 3
    environment:
      ENTERPRISE_ROUTER_URL: http://router:8000
      ENTERPRISE_AGENT_API_KEY: ${CEO_AGENT_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_LOCK_PATH: /shared-locks/.ollama_call.lock
    volumes:
      - shared-locks:/shared-locks
    depends_on:
      router:
        condition: service_healthy
    restart: unless-stopped

  worker-pm:
    build: .
    command: python run_single_agent.py PM --poll-interval 3
    environment:
      ENTERPRISE_ROUTER_URL: http://router:8000
      ENTERPRISE_AGENT_API_KEY: ${PM_AGENT_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_LOCK_PATH: /shared-locks/.ollama_call.lock
    volumes:
      - shared-locks:/shared-locks
    depends_on:
      router:
        condition: service_healthy
    restart: unless-stopped

  worker-marketing:
    build: .
    command: python run_single_agent.py Marketing --poll-interval 3
    environment:
      ENTERPRISE_ROUTER_URL: http://router:8000
      ENTERPRISE_AGENT_API_KEY: ${MARKETING_AGENT_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_LOCK_PATH: /shared-locks/.ollama_call.lock
    volumes:
      - shared-locks:/shared-locks
    depends_on:
      router:
        condition: service_healthy
    restart: unless-stopped

  worker-hr:
    build: .
    command: python run_single_agent.py HR --poll-interval 3
    environment:
      ENTERPRISE_ROUTER_URL: http://router:8000
      ENTERPRISE_AGENT_API_KEY: ${HR_AGENT_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_LOCK_PATH: /shared-locks/.ollama_call.lock
    volumes:
      - shared-locks:/shared-locks
    depends_on:
      router:
        condition: service_healthy
    restart: unless-stopped

  worker-engineering:
    build: .
    command: python run_single_agent.py Engineering --poll-interval 3
    environment:
      ENTERPRISE_ROUTER_URL: http://router:8000
      ENTERPRISE_AGENT_API_KEY: ${ENGINEERING_AGENT_API_KEY}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_LOCK_PATH: /shared-locks/.ollama_call.lock
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    volumes:
      - shared-locks:/shared-locks
      # Engineering's generated-code working directory (OUTPUT_DIR) --
      # persisted so a restart doesn't lose a build already in progress.
      - eng-output:/app/eng_agent_testing
    depends_on:
      router:
        condition: service_healthy
    restart: unless-stopped

volumes:
  router-data:
  shared-locks:
  eng-output:
